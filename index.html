<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volatile AI Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "lottie-web": "https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.10.2/lottie.min.js",
                "chat-manager": "./chat-manager.js",
                "memory-manager": "./memory-manager.js"
            }
        }
    </script>
</head>
<body>
    <div id="app">
        <header>
            <h1>Volatile AI</h1>
            <div id="status">Status: Initializing...</div>
            <div id="memory-status-container">
                LTM Cache: 
                <div id="memory-bar-container">
                    <div id="memory-bar"></div>
                </div>
                <span id="memory-percentage">0%</span>
            </div>
        </header>
        <div id="chat-window">
            <!-- Messages will be injected here -->
        </div>
        <form id="input-form" aria-label="Chat input">
            <input type="text" id="user-input" placeholder="Type your message..." autocomplete="on" inputmode="text" enterkeyhint="send" disabled>
            <button type="submit" aria-label="Send message" disabled>Send</button>
        </form>
    </div>
    <div id="loading-overlay" class="hidden">
        <div id="loading-animation"></div>
        <p>Establishing volatile connection...</p>
    </div>
    <audio id="tts-audio" style="display: none;"></audio>
    <script type="module" src="main.js"></script>
